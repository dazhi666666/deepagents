<title>火星实验室 · 沉浸页面设计样例</title>
<style>

#scene{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}#scene.dragging{cursor:grabbing}#scene>.world-art{display:block;width:100%;height:100%;user-select:none}#scene .device{cursor:pointer}

.site-header{position:fixed;top:26px;left:30px;right:30px;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;pointer-events:none;z-index:5}.site-header>*{pointer-events:auto}.identity{display:flex;align-items:center;gap:12px;filter:drop-shadow(0 2px 9px #34364288);padding-top:3px}.brand-symbol{height:35px;width:35px;stroke:#f2eee3;stroke-width:1.3;fill:none}.identity h1{font-family:var(--serif);font-weight:500;font-size:27px;letter-spacing:3px;margin:0;line-height:1.25}.identity p{font-size:11px;color:#e1e6df;margin:5px 0 0;letter-spacing:1px}.main-nav{display:flex;align-items:center;padding:6px;background:#243c46f2;border:1px solid #9ab2b54d;border-radius:32px;box-shadow:0 10px 36px #2c394c26;gap:2px}.main-nav button{height:39px;padding:0 18px;background:transparent;border-radius:23px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);white-space:nowrap}.main-nav button:hover,.main-nav button[aria-expanded=true]{background:#425e67}.main-nav button svg{width:17px;height:17px;color:#c9d9d9}.surface-button{display:flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:0 15px;border:1px solid #9ab2b554;background:#243c46f2;border-radius:23px;box-shadow:0 8px 22px #2a384b20;font-size:13px}.surface-button .tiny-chevron{width:12px;height:12px}.scene-menu{position:absolute;right:0;top:59px;width:272px;border:1px solid #78979c88;background:#243c46f8;border-radius:16px;padding:18px;box-shadow:0 20px 70px #1c344850}.scene-menu h2{font-size:14px;margin:0 0 15px;font-weight:500}.region-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}.region-list button{background:#3c5762;padding:10px 8px;font-size:13px;border-radius:7px}.scene-settings{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;display:grid;gap:13px;font-size:13px}.scene-settings label{display:flex;align-items:center;justify-content:space-between;gap:12px}.scene-settings input{accent-color:var(--activity);width:17px;height:17px}

.scene-caption{position:fixed;left:32px;bottom:34px;z-index:4;pointer-events:none;text-shadow:0 2px 15px #3a36468c}.scene-caption h2{font-family:var(--serif);font-size:28px;font-weight:500;letter-spacing:2px;margin:0 0 9px}.scene-caption p{font-size:12px;line-height:1.7;color:#e2e4da;margin:0}.source-label{font-size:11px!important;color:#d2d9d3!important;margin-top:9px!important}.view-controls{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px}.view-controls button{min-height:43px}.view-controls .icon-only{width:43px;padding:0}.camera-tools{position:fixed;right:30px;bottom:32px;z-index:5;display:flex;align-items:center;gap:9px}.zoom-controls{display:flex;border:1px solid #9ab2b554;border-radius:24px;background:#243c46f2;padding:3px}.zoom-controls button{width:39px;height:37px;display:grid;place-items:center;background:none;border-radius:50%}.zoom-controls output{display:flex;align-items:center;min-width:52px;justify-content:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.legend{position:fixed;left:32px;bottom:146px;z-index:4;display:flex;gap:16px;font-size:11px;color:#e4e8dd;pointer-events:none;text-shadow:0 1px 8px #26394a}.legend span{display:flex;align-items:center;gap:5px}.legend i{font-style:normal;font-size:14px;color:#c0edf0}
.device-detail{position:fixed;right:30px;top:112px;bottom:102px;width:324px;max-height:650px;overflow:auto;z-index:6;background:#243c46fa;border:1px solid #88a8ae88;border-radius:16px;padding:24px;box-shadow:0 20px 80px #213a4a44}.detail-close{position:absolute;right:13px;top:12px;background:transparent;width:32px;height:32px;display:grid;place-items:center;border-radius:50%}.detail-kicker{color:var(--muted);font-size:12px;margin:0 0 10px}.device-detail h2{font-family:var(--serif);font-size:26px;font-weight:500;margin:0 0 10px}.detail-state{font-size:14px;display:flex;align-items:center;gap:8px}.detail-state i{font-style:normal;color:var(--activity);font-size:18px}.detail-rule{height:1px;background:var(--line);margin:22px 0}.device-detail h3{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 10px}.device-detail .operation{font-size:16px;margin:0 0 14px}.device-detail p{line-height:1.8}.detail-explainer{font-size:12px;color:var(--muted);margin:0}.device-detail dl{display:grid;grid-template-columns:1fr 1.5fr;gap:15px 8px;margin:20px 0;font-size:12px}.device-detail dt{color:var(--muted)}.device-detail dd{margin:0;text-align:right;overflow-wrap:anywhere}.device-detail .disclosure{background:#3b5662;border-left:2px solid #94b6be;padding:11px 12px;font-size:12px;line-height:1.8;color:#d9e2df}.detail-actions{display:flex;gap:8px;margin-top:22px}.detail-actions button{border-radius:7px;min-height:39px;flex:1;padding:0 9px;font-size:12px;background:#456571}.detail-actions button:first-child{background:#badfdf;color:#243c46}.phase-options{display:flex;gap:4px;margin-top:11px}.phase-options button{flex:1;border:1px solid #607b85;padding:8px 0;font-size:11px;border-radius:6px;background:none}.phase-options button[aria-pressed=true]{border-color:var(--activity);background:#3b5d69}
dialog{position:fixed;inset:100px 28px 100px auto;margin:0;padding:0;border:1px solid #88a8ae99;border-radius:18px;background:#243c46fc;color:var(--ink);box-shadow:0 30px 100px #1c304960;width:min(760px,calc(100vw - 56px));max-width:none;height:calc(100dvh - 200px);max-height:760px;overflow:hidden}dialog::backdrop{background:#1e334533;backdrop-filter:blur(2px)}.sheet-header{padding:28px 30px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.sheet-header h2{font-family:var(--serif);font-weight:500;font-size:28px;margin:0}.sheet-header button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#3a5763}.sheet-tabs{display:flex;gap:24px;margin:0 30px;padding-bottom:0;border-bottom:1px solid var(--line);overflow:auto}.sheet-tabs button{height:43px;background:none;white-space:nowrap;padding:0 2px;position:relative;font-size:13px;color:var(--muted)}.sheet-tabs button[aria-selected=true]{color:var(--ink)}.sheet-tabs button[aria-selected=true]:after{content:'';height:2px;position:absolute;left:0;right:0;bottom:0;background:#a0dfe3}.sheet-content{padding:24px 30px 35px;height:calc(100% - 139px);overflow:auto}.sheet-content .source-note{color:var(--muted);font-size:12px;line-height:1.8;margin:0 0 26px}.sheet-content h3{font-size:18px;font-weight:500;line-height:1.6;margin:0 0 19px}.sheet-content .record{padding:18px 0;border-bottom:1px solid #526e7566;display:flex;align-items:flex-start;gap:15px}.record-icon{width:31px;height:31px;flex:none;display:grid;place-items:center;background:#46616b;border-radius:50%;color:#c5e9e9}.record-main{flex:1;min-width:0}.record h4{font-size:14px;font-weight:500;margin:0 0 7px}.record p{font-size:12px;color:var(--muted);margin:0;line-height:1.9}.record button{background:#3f606b;border:1px solid #789ba077;border-radius:6px;font-size:12px;padding:8px 13px;white-space:nowrap}.sheet-empty{padding:24px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:2}.sheet-foot{font-size:12px;color:var(--muted);margin:25px 0 0;line-height:1.9}.equipment-list{display:grid;gap:5px}.equipment-list button{display:flex;justify-content:space-between;gap:15px;align-items:center;text-align:left;padding:14px;background:#354f5c;border-radius:6px;font-size:13px}.equipment-list button span{color:var(--muted);font-size:12px}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);padding:12px 20px;background:#243c46fa;border:1px solid #94b6be;border-radius:25px;font-size:12px;z-index:12;max-width:90vw;text-align:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1150px){.site-header{left:20px;right:20px;top:20px}.main-nav button{padding:0 12px;gap:6px}.identity h1{font-size:23px}.identity .brand-symbol{width:28px}.identity p{font-size:10px}.main-nav button svg{display:none}.device-detail{right:20px;width:300px}.scene-caption{left:22px}.camera-tools{right:20px}.legend{left:22px;gap:11px}.view-controls .label-word{display:none}.view-controls .icon-only{display:none}}
@media(max-width:760px){.site-header{top:17px;left:17px;right:17px;flex-wrap:wrap;row-gap:17px}.identity h1{font-size:23px}.identity p{display:none}.identity .brand-symbol{width:28px;height:28px}.main-nav{order:3;margin:0 auto;max-width:100%;width:max-content;padding:4px}.main-nav button{height:35px;padding:0 11px;font-size:12px}.site-header>.scene-button{margin-left:auto;min-height:37px;padding:0 12px;font-size:12px}.scene-menu{top:46px}.scene-caption{left:18px;bottom:80px}.scene-caption h2{font-size:22px;margin-bottom:6px}.scene-caption p{font-size:11px}.legend{left:18px;bottom:175px;font-size:10px;gap:9px}.legend i{font-size:12px}.view-controls{left:18px;transform:none;bottom:21px}.view-controls button{min-height:39px;font-size:12px;padding:0 11px}.camera-tools{right:16px;bottom:21px;gap:5px}.camera-tools>.surface-button{min-height:39px;width:39px;padding:0}.camera-tools .label-word{display:none}.zoom-controls button{width:31px;height:31px}.zoom-controls output{min-width:37px;font-size:10px}.device-detail{top:auto;left:12px;right:12px;bottom:75px;width:auto;max-height:53dvh;padding:20px}.device-detail h2{font-size:23px}.detail-rule{margin:17px 0}.device-label{min-width:100px;padding:7px 10px}.device-label strong{font-size:12px}.device-label span{font-size:10px}.device-label:not(.is-selected):nth-of-type(n+4){display:none}dialog{inset:112px 12px 80px;width:calc(100vw - 24px);height:calc(100dvh - 192px);max-height:none;border-radius:14px}.sheet-header{padding:21px 20px 12px}.sheet-header h2{font-size:24px}.sheet-tabs{margin:0 20px;gap:20px}.sheet-content{padding:20px;height:calc(100% - 116px)}.record{flex-wrap:wrap}.record button{margin-left:46px}.sheet-content h3{font-size:16px}.toast{bottom:77px}.source-label{font-size:10px!important}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

<body>
<main id="scene" aria-label="火星实验室场景，可拖动和滚轮缩放"><!-- WORLD --></main>
<div class="edge-shade" aria-hidden="true"></div>
<header class="site-header">
  <div class="identity"><svg class="brand-symbol" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path d="M3 23Q20 4 37 17M8 31L22 10L31 29M10 26H30"/></svg><div><h1>火星实验室</h1><p>科研基地观察</p></div></div>
  <nav class="main-nav" aria-label="实验页面">
    <button data-panel="research" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H15M10 3V9L4 19Q3 21 6 21H18Q21 21 20 19L14 9V3M7 15H17"/></svg>科研</button>
    <button data-panel="records" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3H15L19 7V21H6ZM15 3V8H19M9 12H16M9 16H14"/></svg>实验记录</button>
    <button data-panel="team" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20V17Q2 13 8 13Q14 13 14 17V20M15 14Q21 14 21 18V20"/></svg>AI 工作</button>
    <button data-panel="resources" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L5 14H11L10 22L20 9H13Z"/></svg>资源</button>
    <button data-panel="compare" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="7" height="15" rx="1"/><rect x="14" y="3" width="7" height="17" rx="1"/></svg>对照</button>
  </nav>
  <button class="surface-button scene-button" id="scene-menu-toggle" aria-expanded="false" aria-controls="scene-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8L12 3L21 8L12 13ZM3 12L12 17L21 12M3 16L12 21L21 16"/></svg>场景<svg class="tiny-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6L8 10L12 6"/></svg></button>
  <section class="scene-menu" id="scene-menu" aria-label="场景设置" hidden><h2>移动到</h2><div class="region-list"><button data-region="lab">实验室</button><button data-region="greenhouse-C">温室</button><button data-region="water">水处理</button><button data-region="cold">保存区</button><button data-region="energy">能源</button><button data-region="robot-bay">机器人</button></div><div class="scene-settings"><label>器材名称<input id="show-labels" type="checkbox" checked></label><label>减少动态效果<input id="reduced-motion" type="checkbox"></label><button class="surface-button" id="equipment-list-button">器材列表</button></div></section>
</header>
<div id="labels" aria-label="场景对象名称"></div>
<div class="legend" aria-label="工作阶段图例"><span><i>↘</i>装载</span><span><i>↻</i>处理</span><span><i>Ⅱ</i>待机</span><span><i>✓</i>完成</span></div>
<section class="scene-caption" aria-label="观察位置"><h2 id="location-title">前处理与分析区</h2><p>滚轮缩放，拖动探索</p><p class="source-label">设计样例 · 未连接实验记录</p></section>
<div class="view-controls"><button id="pause-view" class="surface-button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5V19M16 5V19"/></svg><span>暂停观看</span></button><button class="surface-button icon-only" data-panel="records" aria-label="查看事件记录" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6H20M4 12H16M4 18H12"/></svg></button></div>
<div class="camera-tools"><div class="zoom-controls" aria-label="镜头缩放"><button id="zoom-out" aria-label="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12H19"/></svg></button><output id="zoom-level" aria-label="当前倍率">1.0×</output><button id="zoom-in" aria-label="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12H19M12 5V19"/></svg></button></div><button class="surface-button" id="reset-camera" aria-label="回到实验室局部"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4H9M15 4H20V9M20 15V20H15M9 20H4V15"/><circle cx="12" cy="12" r="3"/></svg><span class="label-word">回到实验室</span></button></div>
<aside class="device-detail" id="device-detail" aria-labelledby="detail-title" hidden>
 <button class="detail-close" id="close-detail" aria-label="关闭器材详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6L18 18M6 18L18 6"/></svg></button>
 <p class="detail-kicker" id="detail-kind"></p><h2 id="detail-title"></h2><div class="detail-state"><i id="detail-icon"></i><span id="detail-state"></span></div>
 <div class="detail-rule"></div><h3>当前操作</h3><p class="operation" id="detail-operation"></p><p class="detail-explainer" id="detail-description"></p>
 <dl><dt>样品</dt><dd id="detail-sample"></dd><dt>调用来源</dt><dd id="detail-role"></dd><dt>阶段时间</dt><dd>未接入实验记录</dd></dl>
 <div class="disclosure" id="detail-health">没有额外维护标记（设计样例）</div>
 <div class="detail-actions"><button id="focus-device">聚焦器材</button><button id="device-records">查看操作</button></div>
 <div class="detail-rule"></div><h3>切换设计状态</h3><div class="phase-options" id="phase-options"><button data-phase="idle">待机</button><button data-phase="loading">装载</button><button data-phase="processing">处理</button><button data-phase="completed">完成</button></div>
</aside>
<dialog id="page-sheet" aria-labelledby="sheet-title"><div class="sheet-header"><h2 id="sheet-title"></h2><button id="close-sheet" aria-label="关闭页面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6L18 18M6 18L18 6"/></svg></button></div><div class="sheet-tabs" id="sheet-tabs" role="tablist" aria-label="页面分类"></div><section class="sheet-content" id="sheet-content" role="tabpanel" tabindex="0"></section></dialog>
<div class="toast" id="toast" role="status" hidden></div><span class="sr-only" id="selection-status" role="status"></span>
<script type="module">
const devices = /* DEVICES */;
const regions = /* REGIONS */;
const initialCamera = /* INITIAL_CAMERA */;
const overviewCamera = /* OVERVIEW_CAMERA */;
const $ = id => document.getElementById(id);
const scene = $('scene'), world = scene.querySelector('svg'), labels = $('labels'), sheet = $('page-sheet');
const stageIcons = {idle:'Ⅱ',loading:'↘',processing:'↻',completed:'✓'};
const stageNames = {idle:'待机',loading:'正在装载',processing:'处理中',completed:'操作完成'};
const camera = {...initialCamera}, points = new Map(), motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
let selected = null, paused = false, reduced = motionQuery.matches, pointerStart = null, dragMoved = false, returnFocus = null, labelsEnabled = true, activePanel = null;
let toastTimer;
const project = (x,y,z=0) => ({x:(x-y)*37,y:(x+y)*19-z});
function bounds(){const r=scene.getBoundingClientRect();return {...r,width:r.width,height:r.height};}
function view(){const b=bounds(),h=camera.width*b.height/b.width;return {x:camera.cx-camera.width/2,y:camera.cy-h/2,width:camera.width,height:h};}
function createLabels(){labels.replaceChildren();points.clear();const overview=camera.width>3000;const visible=overview?regions:devices.filter(d=>d.primary||d.id===selected||(camera.width<1400&&!d.id.startsWith('heater')));for(const d of visible){const p=overview?project(d.x+6,d.y+5,115):project(d.x,d.y,d.height+32),button=document.createElement('button');button.className='device-label'+(overview?' region-label':'')+(d.id===selected?' is-selected':'');button.dataset.object=d.id;button.dataset.phase=d.phase??'idle';button.setAttribute('aria-label',overview?`移动到${d.label}`:`选择${d.name}，${d.state}`);if(overview){button.textContent=d.label;button.addEventListener('click',()=>jumpRegion(d.id));}else{const title=document.createElement('strong');title.textContent=d.name;const state=document.createElement('span'),icon=document.createElement('i');icon.className='state-icon';icon.textContent=stageIcons[d.phase]??'Ⅱ';state.append(icon,document.createTextNode(d.state));button.append(title,state);button.addEventListener('click',()=>selectDevice(d.id));}labels.append(button);points.set(button,p);}positionLabels();}
function positionLabels(){labels.hidden=!labelsEnabled;const v=view(),b=bounds(),occupied=[];for(const [button,p] of points){const x=(p.x-v.x)/v.width*b.width,y=(p.y-v.y)/v.height*b.height;button.hidden=x<45||x>b.width-45||y<140||y>b.height-100;if(button.hidden)continue;let top=y;const width=button.offsetWidth,height=button.offsetHeight;for(let tries=0;tries<5;tries++){const hit=occupied.some(o=>Math.abs(o.x-x)<(o.w+width)/2+10&&Math.abs(o.y-top)<(o.h+height)/2+12);if(!hit)break;top-=height+20;}button.style.left=Math.max(width/2+12,Math.min(b.width-width/2-12,x))+'px';button.style.top=top+'px';occupied.push({x,y:top,w:width,h:height});}}
function renderCamera(rebuild=false){const v=view();world.setAttribute('viewBox',`${v.x} ${v.y} ${v.width} ${v.height}`);$('zoom-level').textContent=(initialCamera.width/camera.width).toFixed(1)+'×';$('location-title').textContent=camera.width>3000?'火星科研基地':camera.location??'前处理与分析区';if(rebuild)createLabels();else positionLabels();}
function setCamera(next){Object.assign(camera,next);renderCamera(true);}
function resetCamera(){delete camera.location;if(innerWidth<760){const p=project(22,20,30);setCamera({cx:p.x,cy:p.y,width:650});}else setCamera(initialCamera);}
function zoom(factor,clientX,clientY){const b=bounds(),before=view(),nextWidth=Math.max(innerWidth<760?430:850,Math.min(4900,camera.width*factor)),fx=(clientX??b.width/2)/b.width-.5,fy=(clientY??b.height/2)/b.height-.5;camera.cx+=fx*(camera.width-nextWidth);camera.cy+=fy*(before.height-nextWidth*b.height/b.width);camera.width=nextWidth;camera.cx=Math.min(1800,Math.max(-1400,camera.cx));camera.cy=Math.min(1850,Math.max(100,camera.cy));renderCamera(true);}
function jumpRegion(id){if(id==='lab'){resetCamera();}else{const r=regions.find(r=>r.id===id);if(r){const p=project(r.x+6,r.y+5,30);setCamera({cx:p.x,cy:p.y,width:1450,location:r.label});}}toggleMenu(false);}
function focusDevice(){const d=devices.find(d=>d.id===selected);if(!d)return;const p=project(d.x,d.y,60),b=bounds();setCamera({cx:p.x+(b.width>760?170:0),cy:p.y,width:b.width<760?570:Math.max(900,Math.min(1300,b.width*1.05)),location:d.name});}
function selectDevice(id){const d=devices.find(d=>d.id===id);if(!d)return;selected=id;$('device-detail').hidden=false;world.querySelectorAll('.device').forEach(el=>el.classList.toggle('is-selected',el.dataset.device===id));$('detail-title').textContent=d.name;$('detail-kind').textContent=d.kind;$('detail-icon').textContent=stageIcons[d.phase]??'Ⅱ';$('detail-state').textContent=d.state;$('detail-operation').textContent=d.operation;$('detail-description').textContent=d.description;$('detail-sample').textContent=d.sample;$('detail-role').textContent=d.role;$('detail-health').textContent=d.id==='centrifuge-1'?'下次使用前需清洗（设计样例）。维护标记与当前工作阶段分别显示。':'没有额外维护标记（设计样例）';$('selection-status').textContent=`已选择${d.name}，${d.state}`;$('phase-options').querySelectorAll('button').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.phase===d.phase)));createLabels();}
function clearSelection(){const previous=selected;selected=null;$('device-detail').hidden=true;world.querySelectorAll('.device').forEach(el=>el.classList.remove('is-selected'));createLabels();if(previous)$('device-'+previous)?.focus({preventScroll:true});}
function changePhase(phase){const d=devices.find(d=>d.id===selected);if(!d)return;d.phase=phase;d.state=stageNames[phase];d.operation=phase==='idle'?'无活动操作':phase==='completed'?'样例操作完成':'设计状态演示';world.querySelector(`[data-device="${d.id}"]`).dataset.phase=phase;selectDevice(d.id);}
function toggleMenu(open){$('scene-menu').hidden=!open;$('scene-menu-toggle').setAttribute('aria-expanded',String(open));}
function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3200);}
const panels={
 research:{title:'科研',tabs:['科研目标','原始数据','分析结果'],content:[['样品的前处理与检测','围绕器材、样品和操作组织科研记录。','查看器材'],['结果与依据','实验结束后载入原始测量和分析记录，再展示对应数据。']]},
 records:{title:'实验记录',tabs:['物理操作','异常与事件','可用历史'],content:[['自动分液站正在装载','设计样例：托盘进入分液站，移液头保持停靠。','liquid-handler'],['离心机 1 正在处理','设计样例：圆形转子旋转，维护标记独立保留。','centrifuge-1'],['确认仪待机','设计样例：设备没有活动操作，工作部件静止。','confirm']]},
 team:{title:'AI 工作',tabs:['团队','模型活动'],content:[['固定团队','brain、water、crops、agronomist、engineer、analyst。样页只展示页面组织方式。'],['模型与设备的关系','正式页面通过操作 ID 关联调用角色、设备和样品。没有结构化记录的关联保持为空。']]},
 resources:{title:'资源',tabs:['能源','水路','温室'],content:[['能源与生命支持','保留原有能源页面的详细信息，从浮层进入。','energy'],['水处理','储水罐、滤芯和泵具有独立外观。','water'],['温室','查看四个温室舱、植株和灌溉位置。','greenhouse-C']]},
 compare:{title:'对照',tabs:['Multi / Single','评估记录'],content:[['查看同一区域的两个世界','默认一次展示一个世界。正式接入后切换世界时保持区域和镜头偏好。'],['实验结果尚未接入','当前为设计样例，不显示虚构的分数、实时 tick 或胜负结论。']]},
 equipment:{title:'器材列表',tabs:['实验室'],content:[]}
};
function openPanel(key,opener){const panel=panels[key];if(!panel)return;returnFocus=opener??document.activeElement;activePanel=key;$('sheet-title').textContent=panel.title;$('sheet-tabs').replaceChildren();panel.tabs.forEach((label,index)=>{const button=document.createElement('button');button.id=`sheet-tab-${index}`;button.role='tab';button.textContent=label;button.setAttribute('aria-selected',String(index===0));button.setAttribute('aria-controls','sheet-content');button.tabIndex=index===0?0:-1;button.addEventListener('click',()=>setSheetTab(index));$('sheet-tabs').append(button);});setSheetTab(0);toggleMenu(false);if(!sheet.open)sheet.showModal();document.querySelectorAll('.main-nav [data-panel]').forEach(btn=>btn.setAttribute('aria-expanded',String(btn.dataset.panel===key)));}
function setSheetTab(index){const key=activePanel,panel=panels[key],content=$('sheet-content');content.replaceChildren();content.setAttribute('aria-labelledby',`sheet-tab-${index}`);$('sheet-tabs').querySelectorAll('button').forEach((btn,i)=>{btn.setAttribute('aria-selected',String(i===index));btn.tabIndex=i===index?0:-1;});const source=document.createElement('p');source.className='source-note';source.textContent='设计样例 · 这里演示浮层组织与场景定位，尚未载入本轮实验记录。';content.append(source);if(key==='equipment'){const list=document.createElement('div');list.className='equipment-list';devices.forEach(d=>{const button=document.createElement('button');button.textContent=d.name;const state=document.createElement('span');state.textContent=d.state;button.append(state);button.addEventListener('click',()=>{closeSheet();selectDevice(d.id);focusDevice();});list.append(button);});content.append(list);return;}const heading=document.createElement('h3');heading.textContent=index===0?'从记录返回实验室中的对象':panel.tabs[index];content.append(heading);if(index>0){const empty=document.createElement('div');empty.className='sheet-empty';empty.textContent='此分类保留原页面入口。设计样页尚未接入记录，实验结束后显示实际可用内容。';content.append(empty);return;}for(const [title,description,target] of panel.content){const row=document.createElement('article');row.className='record';const icon=document.createElement('span');icon.className='record-icon';icon.textContent='◇';icon.setAttribute('aria-hidden','true');const main=document.createElement('div');main.className='record-main';const h=document.createElement('h4');h.textContent=title;const p=document.createElement('p');p.textContent=description;main.append(h,p);row.append(icon,main);if(target){const button=document.createElement('button');button.textContent=target==='查看器材'?'器材列表':'定位';button.addEventListener('click',()=>{if(target==='查看器材'){openPanel('equipment',button);return;}closeSheet();if(devices.some(d=>d.id===target)){selectDevice(target);focusDevice();}else jumpRegion(target);});row.append(button);}content.append(row);}const foot=document.createElement('p');foot.className='sheet-foot';foot.textContent='关闭面板后继续观察原来的位置。页面浮层不改变实验运行状态。';content.append(foot);}
function restoreSheetFocus(){document.querySelectorAll('.main-nav [data-panel]').forEach(btn=>btn.setAttribute('aria-expanded','false'));if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});activePanel=null;}
function closeSheet(){if(sheet.open)sheet.close();}
sheet.addEventListener('close',restoreSheetFocus);sheet.addEventListener('click',event=>{if(event.target!==sheet)return;const r=sheet.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeSheet();});
$('sheet-tabs').addEventListener('keydown',event=>{const tabs=[...$('sheet-tabs').querySelectorAll('button')],i=tabs.indexOf(document.activeElement);if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].click();tabs[next].focus();});
$('close-sheet').addEventListener('click',closeSheet);document.querySelectorAll('[data-panel]').forEach(button=>button.addEventListener('click',()=>openPanel(button.dataset.panel,button)));
$('scene-menu-toggle').addEventListener('click',()=>toggleMenu($('scene-menu').hidden));document.querySelectorAll('[data-region]').forEach(button=>button.addEventListener('click',()=>jumpRegion(button.dataset.region)));
$('equipment-list-button').addEventListener('click',()=>openPanel('equipment',$('scene-menu-toggle')));$('show-labels').addEventListener('change',event=>{labelsEnabled=event.target.checked;positionLabels();});$('reduced-motion').checked=reduced;$('reduced-motion').addEventListener('change',event=>{reduced=event.target.checked;document.body.classList.toggle('reduced',reduced);});document.body.classList.toggle('reduced',reduced);motionQuery.addEventListener('change',event=>{reduced=event.matches;$('reduced-motion').checked=reduced;document.body.classList.toggle('reduced',reduced);});
$('pause-view').addEventListener('click',()=>{paused=!paused;document.body.classList.toggle('paused',paused);$('pause-view').setAttribute('aria-pressed',String(paused));$('pause-view').querySelector('span').textContent=paused?'继续观看':'暂停观看';$('pause-view').querySelector('path').setAttribute('d',paused?'M8 5L19 12L8 19Z':'M8 5V19M16 5V19');});
$('zoom-out').addEventListener('click',()=>zoom(1.23));$('zoom-in').addEventListener('click',()=>zoom(1/1.23));$('reset-camera').addEventListener('click',resetCamera);$('close-detail').addEventListener('click',clearSelection);$('focus-device').addEventListener('click',focusDevice);$('device-records').addEventListener('click',()=>openPanel('records',$('device-records')));$('phase-options').querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>changePhase(btn.dataset.phase)));
const handleSceneWheel=event=>{event.preventDefault();zoom(Math.exp(Math.max(-100,Math.min(100,event.deltaY))*.0022),event.clientX,event.clientY);};
scene.addEventListener('wheel',handleSceneWheel,{passive:false});labels.addEventListener('wheel',handleSceneWheel,{passive:false});
scene.addEventListener('pointerdown',event=>{if(event.button!==0)return;pointerStart={id:event.pointerId,x:event.clientX,y:event.clientY,cx:camera.cx,cy:camera.cy,target:event.target};dragMoved=false;scene.setPointerCapture(event.pointerId);});
scene.addEventListener('pointermove',event=>{if(!pointerStart||event.pointerId!==pointerStart.id)return;const dx=event.clientX-pointerStart.x,dy=event.clientY-pointerStart.y;if(Math.hypot(dx,dy)>5)dragMoved=true;if(!dragMoved)return;scene.classList.add('dragging');const b=bounds();camera.cx=Math.max(-1400,Math.min(1800,pointerStart.cx-dx/b.width*camera.width));camera.cy=Math.max(100,Math.min(1850,pointerStart.cy-dy/b.width*camera.width));renderCamera();});
scene.addEventListener('pointerup',event=>{if(!pointerStart||event.pointerId!==pointerStart.id)return;const target=pointerStart.target,wasDrag=dragMoved;pointerStart=null;scene.classList.remove('dragging');if(scene.hasPointerCapture(event.pointerId))scene.releasePointerCapture(event.pointerId);if(!wasDrag){const d=target.closest('[data-device]');if(d)selectDevice(d.dataset.device);else{if(!$('scene-menu').hidden)toggleMenu(false);}}});
scene.addEventListener('pointercancel',()=>{pointerStart=null;scene.classList.remove('dragging');});scene.addEventListener('lostpointercapture',()=>{pointerStart=null;scene.classList.remove('dragging');});
scene.addEventListener('dblclick',event=>{const d=event.target.closest('[data-device]');if(d){selectDevice(d.dataset.device);focusDevice();}});
scene.addEventListener('keydown',event=>{const d=event.target.closest('[data-device]');if(d&&['Enter',' '].includes(event.key)){event.preventDefault();selectDevice(d.dataset.device);}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!sheet.open){if(!$('scene-menu').hidden){toggleMenu(false);$('scene-menu-toggle').focus();}else if(selected)clearSelection();}});
window.addEventListener('resize',()=>renderCamera(true));
if(innerWidth<760){const p=project(22,20,30);Object.assign(camera,{cx:p.x,cy:p.y,width:650});}
renderCamera(true);

window.marsDesign={getState:()=>({camera:{...camera},view:view(),selected,paused,reduced,panel:activePanel,designSample:true}),overview:()=>setCamera(overviewCamera),reset:resetCamera};
